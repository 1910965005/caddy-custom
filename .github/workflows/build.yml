name: Build and publish Caddy custom

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - config/**
      - compose*.yaml
      - scripts/**
      - ci/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      caddy_version:
        description: 'Optional stable Caddy 2.x version; empty = latest official caddy:2'
        required: false
        type: string
        default: ''
      cloudflare_ref:
        description: 'Cloudflare module version / commit / branch'
        required: false
        type: string
        default: latest
      layer4_ref:
        description: 'Layer 4 module version / commit / branch'
        required: false
        type: string
        default: latest
  schedule:
    # UTC 20:23 = Asia/Shanghai 04:23 the next day.
    - cron: '23 20 * * *'

permissions:
  contents: read

concurrency:
  group: caddy-custom-publish
  cancel-in-progress: false

jobs:
  build:
    # Publish only the default branch, including manually triggered builds.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve official Caddy images and build inputs
        id: resolve
        env:
          REQUESTED_CADDY_VERSION: ${{ inputs.caddy_version }}
          CLOUDFLARE_REF: ${{ inputs.cloudflare_ref || 'latest' }}
          LAYER4_REF: ${{ inputs.layer4_ref || 'latest' }}
        run: bash scripts/resolve-build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 image for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          # Always resolve module refs again on scheduled rebuilds.
          no-cache-filters: builder
          provenance: false
          tags: |
            ${{ steps.resolve.outputs.image }}:latest
            ${{ steps.resolve.outputs.image }}:caddy-${{ steps.resolve.outputs.version }}
            ${{ steps.resolve.outputs.image }}:build-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            CADDY_BUILD_VERSION=v${{ steps.resolve.outputs.version }}
            CADDY_BUILDER_IMAGE=${{ steps.resolve.outputs.builder_image }}
            CADDY_RUNTIME_IMAGE=${{ steps.resolve.outputs.runtime_image }}
            CLOUDFLARE_REF=${{ steps.resolve.outputs.cloudflare_ref }}
            LAYER4_REF=${{ steps.resolve.outputs.layer4_ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v${{ steps.resolve.outputs.version }}
          cache-from: type=gha,scope=caddy-custom-amd64
          cache-to: type=gha,mode=max,scope=caddy-custom-amd64

      - name: Verify modules, configurations, HTTPS, TCP and UDP
        env:
          VERIFY_IMAGE: ${{ steps.resolve.outputs.image }}:latest
          EXPECTED_CADDY_VERSION: v${{ steps.resolve.outputs.version }}
        run: bash scripts/verify-image.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image tags
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          CADDY_VERSION: ${{ steps.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Publish latest last, after the two recovery/version tags succeed.
          docker push "${IMAGE}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker push "${IMAGE}:caddy-${CADDY_VERSION}"
          docker push "${IMAGE}:latest"
          {
            printf '### Published image\n\n'
            printf -- '- `%s:latest`\n' "$IMAGE"
            printf -- '- `%s:caddy-%s`\n' "$IMAGE" "$CADDY_VERSION"
            printf -- '- `%s:build-%s-%s`\n\n' "$IMAGE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Platform: `linux/amd64`\n\n'
            printf '<details><summary>Resolved Caddy module versions</summary>\n\n```text\n'
            cat modules.txt
            printf '\n```\n</details>\n'
          } >> "$GITHUB_STEP_SUMMARY"
